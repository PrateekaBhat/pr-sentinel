name: PR Sentinel risk analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      # llama3.1 (8B) is too slow for a CPU-only GitHub-hosted runner (2 vCPU) —
      # a single agent call can exceed its own timeout before it even finishes
      # loading the model. llama3.2 (3B) trades some analysis depth for something
      # that actually completes in CI; run a bigger model on self-hosted runners.
      OLLAMA_MODEL: llama3.2
      OLLAMA_EMBED_MODEL: nomic-embed-text
      CHROMA_PERSIST_DIR: ./backend/tmpchroma
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dev dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run deterministic backend tests
        working-directory: backend
        run: |
          python -m pytest engine/tests -q

      - name: Start Ollama
        run: |
          docker pull ollama/ollama:0.5.4
          docker run -d --name pr-sentinel-ollama -p 11434:11434 ollama/ollama:0.5.4
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:11434/v1/models > /dev/null 2>&1; then
              echo "Ollama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not start in time"
          exit 1

      - name: Pull Ollama models
        run: |
          docker exec pr-sentinel-ollama ollama pull "${OLLAMA_MODEL}"
          docker exec pr-sentinel-ollama ollama pull "${OLLAMA_EMBED_MODEL}"

      - name: Warm up Ollama models
        run: |
          # Loading model weights into memory on first inference can itself take
          # a while — do that here, outside the per-request timeouts the app
          # uses, so the actual analysis run isn't racing a cold start.
          curl -sS http://localhost:11434/api/generate \
            -d "{\"model\": \"${OLLAMA_MODEL}\", \"prompt\": \"hi\", \"stream\": false}" > /dev/null
          curl -sS http://localhost:11434/api/embeddings \
            -d "{\"model\": \"${OLLAMA_EMBED_MODEL}\", \"prompt\": \"hi\"}" > /dev/null

      - name: Analyze pull request
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p reports
          set +e
          python backend/cli.py analyze \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${{ github.event.pull_request.number }}" \
            --output reports/report.json \
            --comment reports/report.md \
            --token "${{ secrets.GITHUB_TOKEN }}"
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Read report markdown
        id: report
        if: always()
        run: |
          delimiter="EOF_$(openssl rand -hex 12)"
          {
            echo "report_body<<${delimiter}"
            if [ -s reports/report.md ]; then
              cat reports/report.md
              echo
            else
              echo "No report generated (analysis step failed or produced an empty report)."
            fi
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sentinel-report
          path: reports

      - name: Comment PR summary
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.report.outputs.report_body || 'No report generated (analysis step failed or produced an empty report).' }}

      - name: Enforce analysis result
        if: always()
        run: |
          exit_code="${{ steps.analyze.outputs.exit_code }}"
          case "${exit_code}" in
            0)
              echo "Analysis completed successfully; deterministic policy allowed the PR to proceed."
              ;;
            1)
              echo "PR Sentinel returned BLOCK; failing workflow intentionally."
              exit 1
              ;;
            *)
              echo "PR Sentinel analysis failed unexpectedly (exit code ${exit_code}); failing workflow."
              exit 1
              ;;
          esac

      - name: Stop Ollama
        if: always()
        run: |
          docker rm -f pr-sentinel-ollama || true
